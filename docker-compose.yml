# Official all-in-one self-host compose from
# https://docs.heaper.de/docs/self-hosting
# and https://docs.heaper.de/docs/self-hosting/all-in-one
#
# Copy .env.example to .env and set POSTGRES_PASSWORD before starting.
# Do not commit .env.

services:
  heaper:
    image: ghcr.io/janlunge/heaper:latest
    platform: linux/amd64
    container_name: heaper
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g
    ports:
      - "3010:80"
      # - "5432:5432"  # Uncomment to expose PostgreSQL externally
    environment:
      - HOSTNAME=${HOSTNAME:-localhost}
      - POSTGRES_USER=${POSTGRES_USER:-heaper}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-heaper}
      - ENABLE_INTERNAL_POSTGRES=${ENABLE_INTERNAL_POSTGRES:-true}
    volumes:
      - ./heaper-data/postgres:/var/lib/postgresql/data
      - ./heaper-data/data:/usr/src/app/data
      - ./heaper-data/config:/usr/src/app/config
      - ./heaper-data/thumbnails:/mnt/thumbnails
      - ./heaper-data/storage:/mnt/storage
      - ./heaper-data/backups:/mnt/backups
